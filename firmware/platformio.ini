; ============================================================================
; esp-infoscreen — ESP32-8048S070N (7" 800x480 RGB, ESP32-S3-WROOM-1 N16R8)
; ============================================================================
; framework = espidf (kein Arduino), analog ESP-BMC. Display-Bring-up zuerst.
;
; Board wird als generisches esp32-s3-devkitc-1 gefahren + 16MB Flash / Octal-
; PSRAM / eigene Partitionstabelle via sdkconfig.defaults + board_build.
; (PlatformIO ignoriert CONFIG_PARTITION_TABLE_CUSTOM_FILENAME ohne das
; board_build.partitions-Feld — bewaehrter ESP-BMC-Gotcha.)

[platformio]
src_dir = main

[env:esp32-8048S070N]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; Quelltext + Binary fest auf UTF-8: erlaubt deutsche Umlaute (ÄÖÜäöüß) und °
; DIREKT als UTF-8-Zeichen in String-Literalen (statt \xC3\xBC-Escapes). LVGL
; erwartet UTF-8; die eigenen Fonts (montserrat_de_*) enthalten die Glyphen.
build_flags =
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

; Post-Build: firmware.bin zusaetzlich als bin/<YYYY-MM-DD-HHMM>.bin ablegen
extra_scripts = post:tools/name_bin.py

monitor_speed = 115200
; natives USB-Serial-JTAG des ESP32-S3 (VID 303A/PID 1001)
upload_speed = 460800
