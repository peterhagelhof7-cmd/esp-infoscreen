; ============================================================================
; esp-infoscreen — Diagnose-/Inventur-Firmware (ESP32-8048S070, ESP32-S3 N16R8)
; ----------------------------------------------------------------------------
; Kleine, eigenstaendige Firmware: liest Chip/PSRAM/Flash/MAC/RAM aus, sucht den
; DHT22 (Pin-Scan 17/18, prueft die Checksumme) und scannt best-effort einen
; I2C-Bus auf einen Touch-Controller. Ausgabe menschenlesbar + als "INV {json}"
; ueber Serial (USB-Serial-JTAG), das der Web-Flasher einliest.
; Board/Plattform identisch zur Hauptfirmware.
; ============================================================================

[platformio]
src_dir = main

[env:diag]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
; natives USB-Serial-JTAG des ESP32-S3 (VID 303A/PID 1001)
upload_speed = 460800
